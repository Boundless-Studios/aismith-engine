name: CI

# The public repository's CI. GitHub-hosted runners only: a self-hosted runner
# would run fork pull requests on a private machine. Every action is pinned by
# full commit SHA (Dependabot proposes updates), and the workflow token is
# read-only.

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["engine-v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The base install plus the test extra, and the optional meshfix extra so
      # the MeshFix repair tests run; the torch-backed identity extra stays out
      # of the CPU lane.
      - run: python -m pip install -e ".[test,meshfix]"
      - run: python -m pip install "ruff==0.8.6"
      - run: ruff check backend scripts tools
      - run: python -m pytest -q backend/tests

  supply-chain:
    name: Locks, private-text scan and licence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,meshfix]"
      # The lock tests pin every source and weight; the private-text scan keeps
      # machine names, private addresses and personal paths out of the tree.
      - name: Lock tests and the private-text scan
        run: >-
          python -m pytest -q
          backend/tests/test_engine_sources.py
          backend/tests/test_engine_weights.py
          backend/tests/test_public_hygiene.py
          backend/tests/test_check_licences.py
      # Every lock entry, and every GPL, non-commercial or custom-licensed
      # Python or npm package, must be named in NOTICE.
      - name: Licence gate against NOTICE
        run: python scripts/check_licences.py

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      # Reviewed false positives live in .gitleaks.toml. Findings are redacted.
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact .'

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CONTRIBUTING.md: every commit carries a Signed-off-by line for its
      # author (git commit -s), certifying the Developer Certificate of Origin.
      # Merge commits too: a conflict resolution can carry code of its own.
      - name: Every commit in the pull request is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format='%ae' "$commit")
            trailers=$(git log -1 --format='%B' "$commit" | grep -i '^Signed-off-by:' || true)
            if ! grep -qiF "<$email>" <<<"$trailers"; then
              echo "::error::Commit $commit has no Signed-off-by line for its author. See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit "$missing"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # The UI type-checks against the vendored Mesh2Motion sources, which
      # need their own dependencies.
      - run: npm ci --no-audit --no-fund
        working-directory: vendor/mesh2motion-app
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  release-tag:
    name: Engine tag matches package version
    if: startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag with pyproject version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "engine-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
