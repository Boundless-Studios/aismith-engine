[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundless-asset-judge"
version = "0.1.0"
description = "Independent, engine-neutral artifact evaluation contracts and settlement"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
asset-judge = "asset_judge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
